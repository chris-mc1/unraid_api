name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master
  validate-hacs:
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@22.5.0
        with:
          category: "integration"
